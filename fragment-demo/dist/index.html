<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>碎光收藏室 · 卡牌拼接原型</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23111b23'/%3E%3Ctext x='20' y='29' text-anchor='middle' font-size='30' fill='%23e2bf78'%3E✧%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="expansion.css"></head>
<body>
<header><a class="brand" href="#">✧ <span>碎光收藏室<small>FRAGMENT ATELIER</small></span></a><div class="mode" aria-label="混合程度"><button id="low">低混合 · 2 张</button><button id="high">高混合 · 6 张</button></div><button id="sound" class="quiet">声音：开</button></header>
<main>
<aside><div class="eyebrow">YOUR COLLECTION · CHAPTER 02</div><h2>十二段小小奇遇</h2><p class="sub">两套藏集，十二段等待拼回的故事。</p><div class="album-meter"><span id="albumCount">0 / 12 张</span><span>总收藏进度</span></div><div class="meter"><i id="albumBar"></i></div><div id="seriesTabs" aria-label="收藏系列"></div><div class="series-heading"><span id="seriesProgress"></span><button id="galleryButton" class="quiet" disabled>展示页未解锁</button></div><div id="album"></div><div class="upgrade-box"><span class="eyebrow">收藏能力</span><button id="highlight" class="outline" disabled>同卡碎片高亮 · 未解锁</button><p id="upgradeHelp">完成任意 2 张卡即可解锁</p></div><p class="save-note">进度自动保存在此浏览器</p><button id="reset" class="quiet reset">重新开始收藏</button></aside>
<section class="workspace"><div class="work-heading"><div><div class="eyebrow" id="chapterLabel">THE RESTORATION DESK</div><h1>把散落的故事，拼完整。</h1></div><div class="stats"><span id="placedCount">0 / 72</span><small>碎片归位</small></div></div><div id="seriesBanner"></div>
<div class="desk"><div class="card-info"><span id="rarity" class="pill"></span><h2 id="cardName"></h2><p id="cardLore"></p><div id="cardProgress"></div><button id="reference" class="outline">查看原图</button><button id="hint" class="outline">✦ 提示位置</button><div class="tip">拖动碎片到对应空位<br>或点击碎片，再点击空位<br><span>切换左侧卡片可继续拼另一张</span></div></div><div class="board-wrap"><div id="board" aria-label="卡牌拼接区"></div><div class="board-caption"><span>✧</span> <span id="boardCaption">六片碎光，一段星旅</span> <span>✧</span></div></div><div class="desk-side"><span>星旅档案</span><b id="cardNumber"></b><span>COLLECTION<br>VOL. 01</span></div></div>
<div class="tray-heading"><div><h2>散落的碎片 <span id="trayCount"></span></h2><p id="modeHelp"></p></div><button id="shuffle" class="outline">重新打散</button></div><div id="tray" aria-label="待拼碎片"></div>
</section></main><div id="toast" role="status" aria-live="polite"></div>
<dialog id="completion"><div class="eyebrow">COLLECTION RESTORED</div><div id="completeArt"></div><h2 id="completeTitle"></h2><p id="completeText"></p><button id="continue" class="primary">继续收藏</button></dialog>
<dialog id="gallery"><button id="closeGallery" class="quiet gallery-close" aria-label="关闭系列展示">关闭</button><div class="eyebrow">你的系列完成奖励</div><h2 id="galleryTitle"></h2><p id="gallerySubtitle"></p><div id="galleryCards"></div><p id="galleryQuote"></p><button id="nextSeries" class="primary">开始下一套收藏</button></dialog>
<script src="app.js"></script><script src="game.js"></script></body></html>
